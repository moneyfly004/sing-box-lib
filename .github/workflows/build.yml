name: Build libbox.aar

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      sing_box_version:
        description: 'sing-box version (e.g. 1.14.0)'
        required: false
        default: ''

env:
  DEFAULT_VERSION: '1.14.0'

# 发布 Release 需要写 contents 权限（GITHUB_TOKEN 默认只读，
# 否则 softprops/action-gh-release 报 "Resource not accessible by integration"）
permissions:
  contents: write

jobs:
  build:
    name: Build libbox.aar (Android)
    runs-on: ubuntu-latest
    steps:
      - name: Determine version
        id: ver
        run: |
          V="${{ github.event.inputs.sing_box_version }}"
          if [ -z "$V" ]; then
            REF="${GITHUB_REF_NAME}"
            if [[ "$REF" == v* ]]; then V="${REF#v}"; else V="$DEFAULT_VERSION"; fi
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'

      - uses: android-actions/setup-android@v3

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install gomobile
        run: |
          go install github.com/sagernet/gomobile/cmd/gomobile@latest
          go install github.com/sagernet/gomobile/cmd/gobind@latest
          gomobile init

      - name: Clone sing-box
        run: |
          V=${{ steps.ver.outputs.version }}
          git clone https://github.com/SagerNet/sing-box.git -b "v$V" --depth 1

      - name: Build
        # 参数与 sing-box 官方 cmd/internal/build_libbox 对齐：
        # Go 1.23+ 默认禁止 //go:linkname 引用标准库内部符号
        # （sing-box/gvisor 引用 os.checkPidfdOnce），链接会报
        # "invalid reference to os.checkPidfdOnce"。
        # 必须带官方 LinkerFlags：-checklinkname=0 -s -w -buildid=
        # 以及版本/运行时 godebug 注入；并加 -trimpath -buildvcs=false。
        run: |
          cd sing-box
          gomobile bind -v \
            -o libmoneyfly.aar \
            -androidapi 21 \
            -javapkg=top.moneyfly \
            -libname=moneyfly \
            -trimpath \
            -buildvcs=false \
            -ldflags="-X github.com/sagernet/sing-box/constant.Version=${{ steps.ver.outputs.version }} -X runtime.godebugDefault=multipathtcp=0,tlssha1=1 -checklinkname=0 -s -w -buildid=" \
            -tags="with_quic,with_utls,with_clash_api,with_gvisor" \
            ./experimental/libbox
          ls -lh libmoneyfly.aar

      - name: Package
        run: |
          V=${{ steps.ver.outputs.version }}
          cp sing-box/libmoneyfly.aar "libmoneyfly-$V.aar"

      - uses: actions/upload-artifact@v4
        with:
          name: libmoneyfly-aar
          path: "libmoneyfly-*.aar"

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: "libmoneyfly-*.aar"
          body: "libmoneyfly.aar built from sing-box v${{ steps.ver.outputs.version }}"
