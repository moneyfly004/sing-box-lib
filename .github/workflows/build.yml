name: Build libbox.aar

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      sing_box_version:
        description: 'sing-box version (e.g. 1.14.0)'
        required: false
        default: ''

env:
  DEFAULT_VERSION: '1.14.0'

jobs:
  build:
    name: Build libbox.aar (Android)
    runs-on: ubuntu-latest
    steps:
      - name: Determine version
        id: ver
        run: |
          V="${{ github.event.inputs.sing_box_version }}"
          if [ -z "$V" ]; then
            REF="${GITHUB_REF_NAME}"
            if [[ "$REF" == v* ]]; then V="${REF#v}"; else V="$DEFAULT_VERSION"; fi
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'

      - uses: android-actions/setup-android@v3

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install gomobile
        run: |
          go install github.com/sagernet/gomobile/cmd/gomobile@v0.1.4
          go install github.com/sagernet/gomobile/cmd/gobind@v0.1.4
          gomobile init

      - name: Clone sing-box
        run: |
          V=${{ steps.ver.outputs.version }}
          git clone https://github.com/SagerNet/sing-box.git -b "v$V" --depth 1

      - name: Build
        run: |
          cd sing-box
          gomobile bind -v -androidapi 21 -javapkg=io.nekohasekai -libname=box \
            -tags="with_quic,with_utls,with_clash_api,with_gvisor" \
            ./experimental/libbox
          ls -lh *.aar

      - name: Package
        run: |
          V=${{ steps.ver.outputs.version }}
          cp sing-box/libbox.aar "libbox-$V.aar"

      - uses: actions/upload-artifact@v4
        with:
          name: libbox-aar
          path: "libbox-*.aar"

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: "libbox-*.aar"
          body: "libbox.aar from sing-box v${{ steps.ver.outputs.version }}"
