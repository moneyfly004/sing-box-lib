name: Build libbox.aar

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      sing_box_version:
        description: 'sing-box version (e.g. 1.14.0)'
        required: false
        default: ''

env:
  DEFAULT_VERSION: '1.14.0'

jobs:
  build:
    name: Build libbox.aar (Android)
    runs-on: ubuntu-latest
    steps:
      - name: Determine version
        id: ver
        run: |
          # workflow_dispatch（手动触发）：优先用输入版本，否则默认版本；
          # 只有 tag push（vX.Y.Z）才从 ref 名取版本。
          # 注意：手动触发时 GITHUB_REF_NAME 是分支名（如 main），
          # 不能把它当版本号，否则会 clone "vmain" 失败。
          V="${{ github.event.inputs.sing_box_version }}"
          if [ -z "$V" ] && [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF_NAME#v}"
            V="${TAG:-$DEFAULT_VERSION}"
          fi
          V="${V:-$DEFAULT_VERSION}"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Building sing-box v$V"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Setup Android NDK
        uses: android-actions/setup-android@v3

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install gomobile
        # sing-box 官方 libbox 用 sagernet/gomobile（带 -libname 参数）。
        # 上游 golang.org/x/mobile 的 gomobile 没有 -libname，
        # 会报 "flag provided but not defined: -libname"。
        run: |
          go install github.com/sagernet/gomobile/cmd/gomobile@latest
          go install github.com/sagernet/gomobile/cmd/gobind@latest
          gomobile init

      - name: Clone sing-box
        run: |
          V=${{ steps.ver.outputs.version }}
          git clone https://github.com/SagerNet/sing-box.git -b "v$V" --depth 1
          cd sing-box
          echo "sing-box $(git describe --tags --always)"

      - name: Build libbox.aar
        run: |
          cd sing-box
          gomobile bind -v \
            -androidapi 21 \
            -javapkg=io.nekohasekai \
            -libname=box \
            -tags="with_quic,with_utls,with_clash_api,with_gvisor" \
            ./experimental/libbox
          ls -lh libbox.aar libbox-sources.jar 2>/dev/null || true
          ls -lh *.aar

      - name: Rename artifact
        run: |
          V=${{ steps.ver.outputs.version }}
          cp sing-box/libbox.aar "libbox-$V.aar"
          ls -lh "libbox-$V.aar"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libbox-aar
          path: "libbox-*.aar"

      - name: Publish to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: "libbox-*.aar"
          body: "libbox.aar built from sing-box v${{ steps.ver.outputs.version }}"
          fail_on_unmatched_files: true
